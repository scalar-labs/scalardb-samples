# Customer Service, Shared Cluster pattern.
#
# Compare this file with `separated-clusters/customer-service.properties`. The application code is
# byte-for-byte identical between the two patterns; this file is where the difference lives.
scalar.db.transaction_manager=cluster
scalar.db.contact_points=indirect:scalardb-cluster-node

# Both services talk to the same cluster, and that cluster holds the transaction. No Transaction
# Coordinator is involved.
#
# `false` is the default, so this line could be omitted. It is written out because the point of
# this sample is the difference between the two patterns, and a difference you cannot see in the
# file is not much of a lesson.
scalar.db.cluster.client.transaction_coordinator.enabled=false
