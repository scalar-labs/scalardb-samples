# For creating the Coordinator tables in the Transaction Coordinator's own PostgreSQL, from the
# host. This is a direct-storage configuration, not a cluster one: the TC serves transaction
# control, not schema administration.
#
#   java -jar scalardb-cluster-schema-loader-<version>-all.jar \
#     --config tc-coordinator-storage.properties --coordinator
#
# <version> is the ScalarDB version this sample targets; see `scalarDbVersion` in build.gradle.
scalar.db.storage=jdbc
scalar.db.contact_points=jdbc:postgresql://localhost:5432/postgres
scalar.db.username=postgres
scalar.db.password=postgres
