# Order Service, Separated Clusters pattern.
#
# Compare this file with `shared-cluster/order-service.properties`. The application code is
# byte-for-byte identical between the two patterns; this file is where the difference lives.
scalar.db.transaction_manager=cluster

# This service talks to its own cluster, not to a cluster shared with Customer Service.
scalar.db.contact_points=indirect:order-cluster

# Required on the client too, not just on the cluster node, whenever the Transaction
# Coordinator is enabled: the TC identifies which participant a branch belongs to by this
# ID. Without it the client fails at startup with DB-CLUSTER-10080.
scalar.db.cluster.id=order-cluster

# Transaction control goes to the Transaction Coordinator instead of to the cluster. The TC drives
# two-phase commit across both participant clusters on this service's behalf.
scalar.db.cluster.client.transaction_coordinator.enabled=true
scalar.db.cluster.client.transaction_coordinator.contact_points=indirect:transaction-coordinator
scalar.db.cluster.client.transaction_coordinator.contact_port=60055
