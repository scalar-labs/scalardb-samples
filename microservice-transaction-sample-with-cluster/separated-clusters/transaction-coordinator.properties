# The Transaction Coordinator (TC). It drives two-phase commit across the participant clusters on
# the application's behalf, which is why the application code never implements prepare/validate/
# commit and why the proto has no RPCs for them.
#
# Every key here is written fully qualified. The TC's keys live under
# `scalar.db.cluster.transaction_coordinator.`, which is a different prefix from the participant
# nodes' `scalar.db.cluster.node.`. Mixing them up is easy and the failure is confusing: the image
# defaults SCALAR_DB_CLUSTER_MEMBERSHIP_TYPE to KUBERNETES, so a TC that does not see its own
# standalone_mode key tries to discover members through the Kubernetes API and never starts.
scalar.db.cluster.transaction_coordinator.standalone_mode.enabled=true

# The participant clusters this TC coordinates, by the IDs they set in `scalar.db.cluster.id`.
scalar.db.cluster.transaction_coordinator.clusters=customer-cluster,order-cluster
scalar.db.cluster.transaction_coordinator.clusters.customer-cluster.contact_points=indirect:customer-cluster
scalar.db.cluster.transaction_coordinator.clusters.customer-cluster.contact_port=60053
scalar.db.cluster.transaction_coordinator.clusters.order-cluster.contact_points=indirect:order-cluster
scalar.db.cluster.transaction_coordinator.clusters.order-cluster.contact_port=60053

# The storage holding the Coordinator tables. This is the structural difference from the Shared
# Cluster pattern, where those tables live in the single cluster's storage.
#
# It is not private to the TC. Each participant cluster is configured to reach the same storage,
# because a participant that reads a record left behind by an unfinished transaction has to look
# up that transaction's state to recover it (lazy recovery).
#
# The TC opens this connection at startup and exits if it fails, so this database must be healthy
# before the TC container starts.
scalar.db.storage=jdbc
scalar.db.contact_points=jdbc:postgresql://postgres:5432/postgres
scalar.db.username=postgres
scalar.db.password=postgres

# Capped for the same reason as on the participant clusters: this database serves all three
# ScalarDB components in this pattern.
scalar.db.jdbc.connection_pool.max_total=25
scalar.db.jdbc.table_metadata.connection_pool.max_total=5

# The TC is not a licensed component: it requires no license key.
