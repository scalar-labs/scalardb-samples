# The ScalarDB Cluster that Customer Service owns.
#
# It uses multi-storage for two namespaces:
#   - customer_service: this service's own data, in MySQL.
#   - coordinator: the Coordinator tables, in the PostgreSQL that the Transaction Coordinator owns.
#
# The Coordinator tables are shared on purpose. The Transaction Coordinator writes transaction
# states there, but each participant cluster must be able to read them too: when a read finds a
# record left behind by a transaction that did not finish, the cluster looks up that transaction's
# state to decide whether to roll it forward or back (lazy recovery). A participant that cannot
# reach the Coordinator tables cannot do that.
scalar.db.storage=multi-storage
scalar.db.multi_storage.storages=mysql,coordinatordb

scalar.db.multi_storage.storages.mysql.storage=jdbc
scalar.db.multi_storage.storages.mysql.contact_points=jdbc:mysql://mysql:3306/?sslMode=REQUIRED
scalar.db.multi_storage.storages.mysql.username=root
scalar.db.multi_storage.storages.mysql.password=mysql

scalar.db.multi_storage.storages.coordinatordb.storage=jdbc
scalar.db.multi_storage.storages.coordinatordb.contact_points=jdbc:postgresql://postgres:5432/postgres
scalar.db.multi_storage.storages.coordinatordb.username=postgres
scalar.db.multi_storage.storages.coordinatordb.password=postgres

# Cap the connection pools for the shared Coordinator storage. Three ScalarDB components
# connect to it here (both participant clusters and the Transaction Coordinator), and the
# default pool sizes are far larger than a default PostgreSQL `max_connections` can serve
# three times over.
scalar.db.multi_storage.storages.coordinatordb.jdbc.connection_pool.max_total=25
scalar.db.multi_storage.storages.coordinatordb.jdbc.table_metadata.connection_pool.max_total=5

scalar.db.multi_storage.namespace_mapping=coordinator:coordinatordb
scalar.db.multi_storage.default_storage=mysql

# Run as a single node, without Kubernetes-based membership.
scalar.db.cluster.node.standalone_mode.enabled=true

# Serve the TransactionParticipant service, so the Transaction Coordinator can drive two-phase
# commit against this cluster. `scalar.db.cluster.id` is the participant ID and is required when
# this is enabled.
#
# Note the key prefix: this is `...cluster.node.standalone_mode.enabled`, whereas the Transaction
# Coordinator uses `...cluster.transaction_coordinator.standalone_mode.enabled`. They are different
# keys and are not interchangeable.
scalar.db.cluster.node.transaction_participant.enabled=true
scalar.db.cluster.id=customer-cluster

# License key configurations.
scalar.db.cluster.node.licensing.license_key=
scalar.db.cluster.node.licensing.license_check_cert_pem=
