name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-with-various-java-versions:
    strategy:
      fail-fast: false
      matrix:
        version: [8, 11, 17, 21]
        project:
            - 'microservice-transaction-sample'
            - 'microservice-transaction-sample-with-cluster'
            - 'microservice-transaction-sample-with-shared-cluster-with-jdbc'
            - 'multi-storage-transaction-sample'
            - 'scalardb-kotlin-sample'
            - 'scalardb-sample'
            - 'scalardb-sql-jdbc-sample'
            - 'spring-data-microservice-transaction-sample'
            - 'spring-data-multi-storage-transaction-sample'
            - 'spring-data-sample'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    # The samples request Java 8 through the Gradle toolchain, and the runner image does not
    # always include JDK 8, so install it explicitly. The last version in the list becomes the
    # default JDK (`JAVA_HOME`), which is the one that runs Gradle.
    - name: Set up JDK 8 (toolchain) and JDK ${{ matrix.version }}
      uses: actions/setup-java@v4
      with:
        java-version: |
          8
          ${{ matrix.version }}
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build with Gradle Wrapper
      working-directory: ${{ matrix.project }}
      run: ./gradlew build
